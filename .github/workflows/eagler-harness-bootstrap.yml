name: Eaglercraft harness bootstrap

on:
  push:
    branches:
      - automation/eagler-harness-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UPSTREAM_REPOSITORY: Eaglercraft-Archive/EaglercraftX-1.8-workspace
      UPSTREAM_COMMIT: 746793a11eb67608b4e60660a4dfe205f5f68970
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://github.com/${UPSTREAM_REPOSITORY}.git" upstream
          git -C upstream checkout --detach "${UPSTREAM_COMMIT}"
          git -C upstream submodule update --init --recursive
          git -C upstream bundle create ../eaglercraft-upstream.bundle --all
          tar --exclude='./upstream/.git' -czf eaglercraft-upstream-source.tar.gz upstream

      - name: Record bootstrap environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap-output
          python3 - <<'PY'
          import json, os, platform, subprocess
          def output(*cmd):
              try:
                  return subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
              except Exception as exc:
                  return f"unavailable: {exc}"
          data = {
              "upstream_repository": os.environ["UPSTREAM_REPOSITORY"],
              "upstream_commit": os.environ["UPSTREAM_COMMIT"],
              "runner_os": platform.platform(),
              "machine": platform.machine(),
              "python": platform.python_version(),
              "java": output("java", "-version"),
              "node": output("node", "--version"),
              "npm": output("npm", "--version"),
          }
          with open("bootstrap-output/environment.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2)
          PY

      - name: Build pinned WASM-GC client
        id: wasm_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p bootstrap-output
          cd upstream
          chmod +x gradlew
          start_ns=$(date +%s%N)
          /usr/bin/time -v ./gradlew --no-daemon target_teavm_wasm_gc:makeMainWasmClientBundle --stacktrace \
            > ../bootstrap-output/wasm-build.log 2>&1
          status=$?
          end_ns=$(date +%s%N)
          duration_ms=$(( (end_ns - start_ns) / 1000000 ))
          cd ..
          python3 - "$status" "$duration_ms" <<'PY'
          import json, pathlib, sys
          status = int(sys.argv[1])
          duration_ms = int(sys.argv[2])
          root = pathlib.Path("upstream")
          artifacts = []
          for pattern in ("**/*.wasm", "**/*.js", "**/*.epw", "**/*.html"):
              for path in root.glob(pattern):
                  if path.is_file() and ".gradle" not in path.parts:
                      artifacts.append({"path": str(path.relative_to(root)), "bytes": path.stat().st_size})
          pathlib.Path("bootstrap-output/build-result.json").write_text(
              json.dumps({
                  "exit_code": status,
                  "duration_ms": duration_ms,
                  "success": status == 0,
                  "artifacts": sorted(artifacts, key=lambda item: item["path"]),
              }, indent=2),
              encoding="utf-8",
          )
          PY
          exit "$status"

      - name: Collect generated outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap-output/generated
          if [ -d upstream/target_teavm_wasm_gc/javascript_dist ]; then
            cp -a upstream/target_teavm_wasm_gc/javascript_dist bootstrap-output/generated/
          fi
          if [ -d upstream/target_teavm_wasm_gc/build ]; then
            find upstream/target_teavm_wasm_gc/build -type f \
              \( -name '*.wasm' -o -name '*.js' -o -name '*.epw' -o -name '*.html' \) \
              -exec cp --parents '{}' bootstrap-output/generated/ \;
          fi
          find bootstrap-output -maxdepth 6 -type f -printf '%P\t%s bytes\n' | sort > bootstrap-output/manifest.txt

      - name: Upload pinned source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-upstream-source
          path: |
            eaglercraft-upstream.bundle
            eaglercraft-upstream-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-wasm-build-evidence
          path: bootstrap-output
          compression-level: 6
          if-no-files-found: error
          retention-days: 7
